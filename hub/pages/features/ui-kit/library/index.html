<!doctype html>
<html lang="en">
  <head>
    <title>Component library</title>
    <meta name="aek:order" content="40" />
    <meta name="aek:icon" content="grid-3x3" />
    <meta
      name="aek:tags"
      content="components, component library, UI kit, demo, states, themes, density, dark, light, compact, draggable window, dialog, drop-down, number field, spin button, scrub, slider, ticks, range slider, histogram, radio group, radio, segmented control, select field, select, text field, textarea, search, checkbox, switch, toggle, tooltip, popover, toaster, toast, icons, button, toggle button, hold to confirm, button group, toolbar, link, menu, menu button, split button, badge, tag, chip, spinner, progress bar, skeleton, divider, empty state, loading overlay, kbd, key hint, input glyph"
    />
    <meta
      name="aek:description"
      content="Every UI kit piece running in the page, without the engine: open each one's states and try them with the mouse and the keyboard, in both themes and densities."
    />
  </head>
  <body>
    <h1>Component library</h1>
    <div id="intro"></div>
    <div class="hubComponents" data-hub-components>
      <form class="hubComponentSettings" data-hub-component-settings>
        <fieldset>
          <legend>Theme</legend>
          <label><input type="radio" name="theme" value="" checked />The page's</label>
          <label><input type="radio" name="theme" value="dark" />Dark</label>
          <label><input type="radio" name="theme" value="light" />Light</label>
        </fieldset>
        <fieldset>
          <legend>Density</legend>
          <label><input type="radio" name="density" value="" checked />Default</label>
          <label><input type="radio" name="density" value="compact" />Compact</label>
        </fieldset>
        <p>
          Set on the HUD root the demos open in, and on the kit roots the pieces drawn in the page
          draw in.
        </p>
      </form>
      <div id="window-text"></div>
      <div class="hubComponentDemo" data-hub-demo="window"></div>
      <div id="dialog-text"></div>
      <div class="hubComponentDemo" data-hub-demo="dialog"></div>

      <div id="popover-text"></div>
