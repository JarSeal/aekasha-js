<!doctype html>
<html lang="en">
  <head>
    <title>Font study</title>
    <meta name="aek:menu" content="Font study (p801)" />
    <meta name="aek:order" content="90" />
    <meta
      name="aek:tags"
      content="fonts, typography, font study, specimen, inter, geist, ibm plex, jetbrains mono, tabular figures, p801"
    />
    <meta
      name="aek:description"
      content="p801 Phase 0's font study: the sans and mono candidates in a dense debugger panel at 11-13 px and at the Hub's sizes, in both themes, with their widths and file sizes."
    />
  </head>
  <body>
    <h1>Font study</h1>
    <div id="intro"></div>
    <div class="fontStudy" data-font-study>
      <p class="fsStatus" data-fs-status>Loading the candidates from the dev server…</p>
    </div>
    <style>
      /* p801 Phase 0's specimen (a dev page, so none of this is in the public Hub). The panels use
         the Hub's own colour values for both themes (_tokens.scss at f962bb3), whatever the page's
         theme is, so dark and light sit side by side. */
      .fontStudy {
        --fs-gap: 1rem;
        margin-top: 2rem;
      }
      .fontStudy :where(h2, h3) {
        scroll-margin-top: 5rem;
      }
      .fsStatus {
        color: var(--hub-text-muted);
      }
      .fsControls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.5rem;
        margin: 1rem 0;
        padding: 0.75rem 1rem;
        border: 1px solid var(--hub-border);
        border-radius: var(--hub-radius);
        background: var(--hub-panel);
        font-size: 0.875rem;
      }
      .fsControls fieldset {
        margin: 0;
        padding: 0;
        border: 0;
      }
      .fsControls legend {
        margin-bottom: 0.25rem;
        color: var(--hub-text-muted);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .fsControls label {
        margin-right: 0.75rem;
        white-space: nowrap;
      }
      .fsSummary {
        overflow-x: auto;
        margin: 1rem 0;
      }
      .fsSummary table {
        border-collapse: collapse;
        font-size: 0.875rem;
        font-variant-numeric: tabular-nums;
      }
      .fsSummary th,
      .fsSummary td {
        padding: 0.35rem 0.6rem;
        border: 1px solid var(--hub-border);
        text-align: left;
        white-space: nowrap;
      }
      .fsSummary td.fsNum {
        text-align: right;
      }
      .fsPair {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(17.5rem, 1fr));
        gap: var(--fs-gap);
        margin: 1rem 0;
      }
      .fsCaption {
        margin: 0 0 0.35rem;
        color: var(--hub-text-muted);
        font-size: 0.75rem;
      }

      /* The mock dense panel: the debugger's layout, sized in px from the panel's font size */
      .fsPanel {
        --fs-bg: #070b14;
        --fs-surface: #0c1321;
        --fs-hover: #111b2d;
        --fs-border: #1b2638;
        --fs-border-strong: #2b3a52;
        --fs-text: #e6ebf2;
        --fs-muted: #9aa6b8;
        --fs-accent: #3fd8f2;
        --fs-warning: #f2c13f;
        padding: 0.75em;
        border: 1px solid var(--fs-border);
        border-radius: 6px;
        background: var(--fs-surface);
        color: var(--fs-text);
        line-height: 1.35;
        font-synthesis: none;
      }
      .fsPanel_light {
        --fs-bg: #f5f7fa;
        --fs-surface: #ffffff;
        --fs-hover: #edf1f6;
        --fs-border: #dce3ec;
        --fs-border-strong: #b9c4d3;
        --fs-text: #0f1726;
        --fs-muted: #4b5668;
        --fs-accent: #0a7590;
        --fs-warning: #9a6a00;
      }
      .fsPanelTitle {
        margin: 0 0 0.6em;
        font-weight: 600;
      }
      .fsRow {
        display: grid;
        grid-template-columns: minmax(0, 42%) minmax(0, 1fr);
        align-items: center;
        gap: 0.6em;
        min-height: 2em;
      }
      .fsLabel {
        overflow: hidden;
        color: var(--fs-muted);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fsFields {
        display: flex;
        gap: 0.35em;
        min-width: 0;
      }
      .fsField {
        flex: 1 1 0;
        min-width: 0;
        padding: 0.2em 0.45em;
        border: 1px solid var(--fs-border-strong);
        border-radius: 3px;
        background: var(--fs-bg);
        color: var(--fs-text);
        text-align: right;
        white-space: nowrap;
      }
      .fsField_text {
        text-align: left;
      }
      .fsCheck {
        display: inline-block;
        width: 1.1em;
        height: 1.1em;
        margin-right: 0.4em;
        border-radius: 3px;
        background: var(--fs-accent);
        vertical-align: -0.2em;
      }
      .fsMonitor {
        color: var(--fs-text);
        white-space: nowrap;
      }
      .fsMonitor small {
        color: var(--fs-muted);
        font-size: 0.85em;
      }
      .fsTable {
        width: 100%;
        margin: 0.75em 0 0;
        border-collapse: collapse;
      }
      .fsTable th,
      .fsTable td {
        padding: 0.2em 0.4em;
        border: 0;
        border-bottom: 1px solid var(--fs-border);
        text-align: right;
        font-weight: 400;
      }
      .fsTable th:first-child,
      .fsTable td:first-child {
        text-align: left;
      }
      .fsTable thead th {
        color: var(--fs-muted);
      }
      .fsTable .fsWarn {
        color: var(--fs-warning);
      }
      .fsTable tfoot td {
        border-bottom: 0;
        font-weight: 600;
      }
      .fsCode {
        margin: 0.75em 0 0;
        padding: 0.5em 0.6em;
        border-radius: 3px;
        background: var(--fs-bg);
        color: var(--fs-muted);
        white-space: pre;
        overflow-x: auto;
      }
      .fsCode b {
        color: var(--fs-text);
        font-weight: 500;
      }
      .fsTnum {
        font-variant-numeric: tabular-nums;
      }
      .fsPnum {
        font-variant-numeric: proportional-nums;
      }

      /* Per font: the Hub's sizes and the glyphs */
      .fsFont {
        margin: 2.5rem 0 0;
        padding-top: 1.5rem;
        border-top: 1px solid var(--hub-border);
      }
      .fsHubSizes {
        padding: 1rem 1.25rem;
        border-radius: var(--hub-radius);
      }
      .fsHubSizes > * {
        margin: 0 0 0.5rem;
      }
      .fsHubSizes .fsH1 {
        font-size: 2.75rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.25;
      }
      .fsHubSizes .fsH2 {
        font-size: 1.625rem;
        font-weight: 650;
        letter-spacing: -0.02em;
        line-height: 1.25;
      }
      .fsHubSizes .fsH3 {
        font-size: 1.25rem;
        font-weight: 650;
        letter-spacing: -0.02em;
        line-height: 1.25;
      }
      .fsHubSizes .fsBody {
        font-size: 1rem;
        line-height: 1.65;
      }
      .fsHubSizes .fsSmall {
        color: var(--fs-muted);
        font-size: 0.8125rem;
      }
      .fsGlyphs {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.25rem 1rem;
        align-items: baseline;
        font-size: 1.5rem;
      }
      .fsGlyphs dt {
        color: var(--fs-muted);
        font-size: 0.75rem;
      }
      .fsGlyphs dd {
        margin: 0;
      }
    </style>
    <script type="module">
      // The candidates' woff2 files are in node_modules (dev dependencies for the study, p801 D8).
      // A dev page can't name their absolute path, so each URL comes from the dev server:
      // `/@id/<file>?import` is Vite's asset module (`export default "/@fs/…"`, no Vite client).
      // Vite-internal, and fine for a temporary dev-only page; nothing here is in a public build.
      const fontUrl = async (file) =>
        (await import(/* @vite-ignore */ `/@id/${file}?import`)).default;

      const SANS = [
        {
          id: 'inter',
          name: 'Inter',
          pkg: '@fontsource-variable/inter',
          weight: '100 900',
          faces: {
            normal: 'inter-latin-wght-normal.woff2',
            italic: 'inter-latin-wght-italic.woff2',
          },
          note: 'The Hub’s font today (the same file as hub/_assets/fonts/).',
        },
        {
          id: 'geist',
          name: 'Geist',
          pkg: '@fontsource-variable/geist',
          weight: '100 900',
          faces: {
            normal: 'geist-latin-wght-normal.woff2',
            italic: 'geist-latin-wght-italic.woff2',
          },
        },
        {
          id: 'plexSans',
          name: 'IBM Plex Sans',
          pkg: '@fontsource-variable/ibm-plex-sans',
          weight: '100 700',
          faces: {
            normal: 'ibm-plex-sans-latin-wght-normal.woff2',
            italic: 'ibm-plex-sans-latin-wght-italic.woff2',
          },
        },
      ];
      const MONO = [
        {
          id: 'jetbrains',
          name: 'JetBrains Mono',
          pkg: '@fontsource-variable/jetbrains-mono',
          weight: '100 800',
          faces: {
            normal: 'jetbrains-mono-latin-wght-normal.woff2',
            italic: 'jetbrains-mono-latin-wght-italic.woff2',
          },
        },
        {
          id: 'geistMono',
          name: 'Geist Mono',
          pkg: '@fontsource-variable/geist-mono',
          weight: '100 900',
          faces: {
            normal: 'geist-mono-latin-wght-normal.woff2',
            italic: 'geist-mono-latin-wght-italic.woff2',
          },
        },
        {
          id: 'plexMono',
          name: 'IBM Plex Mono',
          pkg: '@fontsource/ibm-plex-mono',
          // No variable build: one static file per weight (400, 500 and 600 are the ones a UI uses)
          faces: {
            normal: 'ibm-plex-mono-latin-400-normal.woff2',
            500: 'ibm-plex-mono-latin-500-normal.woff2',
            600: 'ibm-plex-mono-latin-600-normal.woff2',
            italic: 'ibm-plex-mono-latin-400-italic.woff2',
          },
          note: 'Static only (no variable build): its sizes are 400, 500, 600 and the 400 italic.',
        },
      ];
      // References, not candidates: the font the debugger has today and D8's default token
      const REFERENCES = [
        {
          id: 'today',
          name: 'Today (page.scss)',
          family: `'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif`,
          note: 'The full page’s and the debugger’s font now.',
        },
        {
          id: 'system',
          name: 'System UI',
          family: `system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif`,
          note: 'D8’s default sans token: what an app that doesn’t opt in gets.',
        },
        {
          id: 'systemMono',
          name: 'System mono',
          family: `ui-monospace, 'SFMono-Regular', 'Cascadia Code', Menlo, Consolas, monospace`,
          mono: true,
          note: 'The Hub’s mono today.',
        },
      ];
      const SIZES = [11, 12, 13];
      // A label column's text, as the debugger's tabs have it, for the width measure
      const LABEL_SAMPLE =
        'Shadow camera near plane Intensity Position Cast shadow Map size Frame time Ambient sky colour Max sub steps';

      const root = document.querySelector('[data-font-study]');
      const status = root.querySelector('[data-fs-status]');
      const familyOf = (font) => font.family ?? `'Study ${font.name}'`;
      const esc = (text) => text.replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
      const kb = (bytes) => (bytes / 1024).toFixed(1);

      const loadFont = async (font) => {
        font.bytes = {};
        await Promise.all(
          Object.entries(font.faces).map(async ([face, file]) => {
            const url = await fontUrl(`${font.pkg}/files/${file}`);
            const buffer = await (await fetch(url)).arrayBuffer();
            font.bytes[face] = buffer.byteLength;
            const isItalic = face === 'italic';
            const weight = /^\d+$/.test(face) ? face : font.weight ?? '400';
            const fontFace = new FontFace(familyOf(font).slice(1, -1), buffer, {
              style: isItalic ? 'italic' : 'normal',
              weight,
            });
            document.fonts.add(await fontFace.load());
          })
        );
      };

      // Characters of LABEL_SAMPLE that fit in 280 px, and the x-height as a share of the size
      const measure = (font) => {
        const ctx = document.createElement('canvas').getContext('2d');
        font.chars = {};
        for (const size of SIZES) {
          ctx.font = `400 ${size}px ${familyOf(font)}`;
          const perChar = ctx.measureText(LABEL_SAMPLE).width / LABEL_SAMPLE.length;
          font.chars[size] = Math.floor(280 / perChar);
        }
        ctx.font = `400 100px ${familyOf(font)}`;
        font.xHeight = ctx.measureText('x').actualBoundingBoxAscent / 100;
      };

      const renderSummary = (fonts) => {
        const rows = fonts
          .map((font) => {
            const total = font.bytes ? Object.values(font.bytes).reduce((a, b) => a + b, 0) : 0;
            return `<tr>
              <td><a href="#fs-${font.id}">${esc(font.name)}</a></td>
              <td>${font.mono ? 'mono' : 'sans'}</td>
              <td class="fsNum">${font.bytes ? kb(font.bytes.normal) : '–'}</td>
              <td class="fsNum">${font.bytes ? kb(total) : '–'}</td>
              ${SIZES.map((size) => `<td class="fsNum">${font.chars[size]}</td>`).join('')}
              <td class="fsNum">${(font.xHeight * 100).toFixed(1)} %</td>
            </tr>`;
          })
          .join('');
        return `<div class="fsSummary"><table>
          <thead><tr><th>Font</th><th>Kind</th><th>Normal (KiB)</th><th>All faces (KiB)</th>
          ${SIZES.map((size) => `<th>Chars / 280 px @ ${size}</th>`).join('')}<th>x-height</th></tr></thead>
          <tbody>${rows}</tbody></table></div>`;
      };

      // The profiler-like table's rows: stage, ms, share, and a class for the one over its budget
      const STAGES = [
        ['Main', '0.412', '4.1'],
        ['Physics step ×2', '2.118', '21.3'],
        ['Render sync', '0.087', '0.9'],
        ['Render', '6.904', '69.4', 'fsWarn'],
        ['Late main', '0.430', '4.3'],
      ];

      // The mock debugger panel: labels in the sans, numbers in the sans' tabular figures or the mono
      const renderPanel = ({ sans, mono, size, theme, numbers }) => {
        const num = numbers === 'mono' ? `font-family:${familyOf(mono)}` : '';
        const field = (value, cls = '') =>
          `<span class="fsField fsTnum ${cls}" style="${num}">${value}</span>`;
        const figure = (value, cls = '') => `<td class="${cls}" style="${num}">${value}</td>`;
        const row = (label, content) =>
          `<div class="fsRow"><span class="fsLabel" title="${esc(label)}">${esc(label)}</span><span class="fsFields">${content}</span></div>`;
        return `<div class="fsPanel fsPanel_${theme}" style="font-family:${familyOf(sans)};font-size:${size}px">
          <p class="fsPanelTitle">Directional light · sunLight</p>
          ${row('Intensity', field('2.750'))}
          ${row('Shadow camera near plane', field('0.0125'))}
          ${row('Position', field('-12.500') + field('48.000') + field('7.250'))}
          ${row('Cast shadow', '<span><span class="fsCheck"></span>true</span>')}
          ${row('Map size', field('2048 × 2048', 'fsField_text'))}
          ${row('Frame time (tabular)', `<span class="fsMonitor fsTnum" style="${num}" data-fs-monitor>16.67 <small>ms</small></span>`)}
          ${row('Frame time (proportional)', `<span class="fsMonitor fsPnum" data-fs-monitor>16.67 <small>ms</small></span>`)}
          <table class="fsTable fsTnum">
            <thead><tr><th>Stage</th><th>ms</th><th>%</th></tr></thead>
            <tbody>${STAGES.map(([stage, ms, share, cls = '']) => `<tr><td>${stage}</td>${figure(ms, cls)}${figure(share, cls)}</tr>`).join('')}</tbody>
            <tfoot><tr><td>Total</td>${figure('9.951')}${figure('100.0')}</tr></tfoot>
          </table>
          <p class="fsCode" style="font-family:${familyOf(mono)}"><b>entity</b> 0x0001F4A2  <b>hash</b> 811c9dc5
<b>id</b> sunLight_01  0O 1lI |  {x: -12.5, y: 48}</p>
        </div>`;
      };

      const renderPair = (opts) =>
        `<div class="fsPair">${['dark', 'light']
          .map(
            (theme) =>
              `<div><p class="fsCaption">${opts.size} px, ${theme}</p>${renderPanel({ ...opts, theme })}</div>`
          )
          .join('')}</div>`;

      const renderHubSizes = (
        font,
        theme
      ) => `<div class="fsPanel fsPanel_${theme} fsHubSizes" style="font-family:${familyOf(font)}">
          <p class="fsH1">Physics on its own thread</p>
          <p class="fsH2">Deterministic scene loads</p>
          <p class="fsH3">The transform buffer</p>
          <p class="fsBody">Bodies are ECS components made by <i>createPhysicsEntity</i>. A scene simulates identically on every visit, in both worker targets: 1,024 bodies at 60 Hz, 0.25 ms per step.</p>
          <p class="fsSmall">Sample caption · 21 scenes · 3,072 entities · 0.04 ms per query</p>
        </div>`;

      const renderMonoSizes = (
        font,
        theme
      ) => `<div class="fsPanel fsPanel_${theme}" style="font-family:${familyOf(font)};font-size:14px;line-height:1.6">
          <p class="fsCode" style="margin:0;font-family:inherit">const body = await createPhysicsEntity({
  id: 'box_01', mass: 0.25, position: [0, 4.5, -12],
}); // 0O 1lI | rn m  =&gt; !== &lt;=</p>
        </div>`;

      const renderGlyphs = (font) => `<dl class="fsGlyphs" style="font-family:${familyOf(font)}">
          <dt>Ambiguous</dt><dd>0O 1lI| rn m S5 Z2 B8</dd>
          <dt>Tabular</dt><dd class="fsTnum">1111.11<br />8888.88</dd>
          <dt>Proportional</dt><dd class="fsPnum">1111.11<br />8888.88</dd>
          <dt>Weights</dt><dd><span style="font-weight:400">Regular</span> <span style="font-weight:500">Medium</span> <span style="font-weight:600">Semibold</span> <i>Italic</i></dd>
        </dl>`;

      const renderFont = (font, state) => {
        const sizesNote = font.bytes
          ? Object.entries(font.bytes)
              .map(([face, bytes]) => `${face} ${kb(bytes)} KiB`)
              .join(', ')
          : 'system font: nothing to download';
        const specimen = font.mono
          ? `<div class="fsPair">${['dark', 'light'].map((theme) => `<div><p class="fsCaption">The Hub's code size (14 px), ${theme}</p>${renderMonoSizes(font, theme)}</div>`).join('')}</div>
             ${SIZES.map((size) => renderPair({ sans: state.sans, mono: font, size, numbers: 'mono' })).join('')}`
          : `${SIZES.map((size) => renderPair({ sans: font, mono: state.mono, size, numbers: 'sans' })).join('')}
             <div class="fsPair">${['dark', 'light'].map((theme) => `<div><p class="fsCaption">The Hub's sizes, ${theme}</p>${renderHubSizes(font, theme)}</div>`).join('')}</div>`;
        return `<section class="fsFont" id="fs-${font.id}">
          <h3>${esc(font.name)}</h3>
          <p class="fsCaption">${esc(font.pkg ?? font.family)} · ${font.weight ? `weights ${font.weight} · ` : ''}${sizesNote}${font.note ? ` · ${esc(font.note)}` : ''}</p>
          ${renderGlyphs(font)}
          ${specimen}
        </section>`;
      };

      const radios = (name, fonts, current) =>
        fonts
          .map(
            (font) =>
              `<label><input type="radio" name="${name}" value="${font.id}" ${font === current ? 'checked' : ''} /> ${esc(font.name)}</label>`
          )
          .join('');

      const render = (fonts, state) => {
        const sansFonts = fonts.filter((font) => !font.mono);
        const monoFonts = fonts.filter((font) => font.mono);
        root.innerHTML = `
          <h2 id="fs-summary">The candidates</h2>
          ${renderSummary(fonts)}
          <h2 id="fs-pairing">A pairing</h2>
          <form class="fsControls" data-fs-controls>
            <fieldset><legend>Sans</legend>${radios('sans', sansFonts, state.sans)}</fieldset>
            <fieldset><legend>Mono</legend>${radios('mono', monoFonts, state.mono)}</fieldset>
            <fieldset><legend>Numbers in</legend>
              <label><input type="radio" name="numbers" value="sans" ${state.numbers === 'sans' ? 'checked' : ''} /> the sans (tabular)</label>
              <label><input type="radio" name="numbers" value="mono" ${state.numbers === 'mono' ? 'checked' : ''} /> the mono</label>
            </fieldset>
            <fieldset><legend>Monitors</legend>
              <label><input type="checkbox" name="paused" ${state.isPaused ? 'checked' : ''} /> paused</label>
            </fieldset>
          </form>
          ${SIZES.map((size) => renderPair({ ...state, size })).join('')}
          <h2 id="fs-fonts">Each font</h2>
          <p class="fsCaption">A sans is shown with the pairing's mono, a mono with the pairing's sans.</p>
          ${fonts.map((font) => renderFont(font, state)).join('')}`;
        root.querySelector('[data-fs-controls]').addEventListener('change', (event) => {
          const form = event.currentTarget;
          const scrollY = window.scrollY;
          render(fonts, {
            sans: sansFonts.find((font) => font.id === form.sans.value),
            mono: monoFonts.find((font) => font.id === form.mono.value),
            numbers: form.numbers.value,
            isPaused: form.paused.checked,
          });
          window.scrollTo(0, scrollY);
        });
        monitors.isPaused = state.isPaused;
      };

      // The monitors change ten times a second, so proportional figures show their jitter
      const monitors = { isPaused: false, step: 0 };
      setInterval(() => {
        if (monitors.isPaused) return;
        monitors.step += 1;
        const ms = 16.67 + Math.sin(monitors.step * 0.7) * 4.1 + ((monitors.step * 37) % 11) / 10;
        for (const el of root.querySelectorAll('[data-fs-monitor]'))
          el.firstChild.nodeValue = `${ms.toFixed(2)} `;
      }, 100);

      try {
        const candidates = [...SANS, ...MONO.map((font) => ({ ...font, mono: true }))];
        await Promise.all(candidates.map(loadFont));
        const fonts = [...candidates, ...REFERENCES];
        fonts.forEach(measure);
        render(fonts, {
          sans: fonts.find((font) => font.id === 'inter'),
          mono: fonts.find((font) => font.id === 'jetbrains'),
          numbers: 'sans',
          isPaused: false,
        });
      } catch (err) {
        status.textContent = `The candidates didn’t load (${err.message}): this page needs the dev server and the study’s dev dependencies (yarn install).`;
      }
    </script>
  </body>
</html>
